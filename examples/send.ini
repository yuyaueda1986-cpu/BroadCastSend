# broadcast_send のコンフィグ例
# - 行頭の # または ; はコメント。行末コメントは使えません（値の一部として扱われエラーになります）。
# - 値の前後の空白は除去されます。
# - 相対パスは、このコンフィグファイルのあるディレクトリを基準に解決します。
# - NIC名とIPアドレスは例です。実環境の値に書き換えてください。

[network]
interface = ens192
source_ip = 192.168.10.10
# 0 はOSによる自動割当
source_port = 0
# source_ip とネットマスクから求まるサブネットブロードキャストアドレス
broadcast_ip = 192.168.10.255
destination_port = 50000

[payload]
# binary: ファイル内容をそのまま送信 / hex: "01 02 FF" のような2桁16進数（空白・改行区切り可）
format = hex
file = payload.hex

[send]
# 周期（μs）。100以上
period_us = 100
# 1周期に連続送信する個数（同じデータ）
packets_per_cycle = 1
# 0 は時間制限なし
duration_sec = 60
# 0 は試行数制限なし（成功・失敗を合わせた送信試行数）
max_attempts = 0

[stats]
# 区間集計の間隔（秒）。0 は終了時の集計のみ
interval_sec = 1
# 送信統計CSV。既存ファイルは上書きしません（省略時はCSVなし、区間集計を標準出力へ）
file = sender.csv
