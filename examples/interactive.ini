# 初心者向けの部分設定。未指定の項目は起動時に一件ずつ質問します。
# ./broadcast_send --config examples/interactive.ini --check-config
# NICを候補から選ぶと、送信元IPv4とブロードキャストアドレスを補完します。

[payload]
format = hex
# コンフィグ内の相対パスはこのファイルのディレクトリ基準です。
file = payload.hex

[send]
# 最初は1秒ごとに1個を60秒間送ります。
period_us = 1000000
packets_per_cycle = 1
duration_sec = 60
max_attempts = 0
